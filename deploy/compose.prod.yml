# Production / demo stack. Only caddy publishes ports (80/443), plus :8080 bound to
# BULKHEAD_BIND_IP so the loadgen host can reach the gateway directly (SG: from #2 only).
# Postgres, Redis and the Docker socket are never published.
# Usage: see deploy/RUNBOOK.md. Env file: deploy/.env (from deploy/.env.example).
name: bulkhead
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bulkhead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: bulkhead
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulkhead"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  predictor:
    image: bulkhead/predictor:prod
    restart: unless-stopped
    environment:
      PREDICTOR_CAPACITY_COST_UNITS_S: ${PREDICTOR_CAPACITY_COST_UNITS_S:-200}

  bulkheadd:
    image: bulkhead/platform:prod
    container_name: bulkheadd # tenant workers resolve this name on their per-tenant networks
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://bulkhead:${POSTGRES_PASSWORD}@postgres:5432/bulkhead?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ISOLATION: ${ISOLATION:-on}
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?}
      PREDICTOR_URL: http://predictor:8000
      PREDICTOR_CAPACITY_COST_UNITS_S: ${PREDICTOR_CAPACITY_COST_UNITS_S:-200}
      DASHBOARD_ORIGINS: https://${SITE_ADDRESS:-localhost}${CADDY_HTTPS_PORT:+:${CADDY_HTTPS_PORT}},http://localhost:3000
      ATTACH_CONTAINER: bulkheadd
      DB_PROXY_URL: http://bulkheadd:8080/internal/db
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"] # needed: cgroup update + worker lifecycle
    ports: ["${BULKHEAD_BIND_IP:-127.0.0.1}:8080:8080"]

  dashboard:
    image: bulkhead/dashboard:prod
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [bulkheadd, dashboard]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # one-off jobs: docker compose -f compose.prod.yml run --rm migrate|seed
  migrate:
    profiles: [tools]
    image: bulkhead/platform:prod
    entrypoint: ["/migrate"]
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgres://bulkhead:${POSTGRES_PASSWORD}@postgres:5432/bulkhead?sslmode=disable
  seed:
    profiles: [tools]
    image: bulkhead/platform:prod
    entrypoint: ["/seed"]
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgres://bulkhead:${POSTGRES_PASSWORD}@postgres:5432/bulkhead?sslmode=disable

volumes:
  pgdata:
  caddy_data:
  caddy_config:

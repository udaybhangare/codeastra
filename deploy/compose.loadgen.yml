# Box #2 (bulkhead-loadgen). Runs the loadgen CLI against box #1.
#   docker compose -f compose.loadgen.yml run --rm loadgen ab S1 --seed 42
# Needs deploy/.env with LOADGEN_TARGET, LOADGEN_ADMIN_KEY and deploy/keys.json (copied from box #1).
# keys.json must be world-readable (chmod 644): the container runs as non-root.
name: bulkhead-loadgen
services:
  loadgen:
    image: bulkhead/loadgen:prod
    environment:
      LOADGEN_TARGET: ${LOADGEN_TARGET:?set LOADGEN_TARGET}
      LOADGEN_KEYS_FILE: /keys.json
      LOADGEN_ADMIN_KEY: ${ADMIN_API_KEY:?}
    volumes: ["./keys.json:/keys.json:ro", "./results:/results"]
    working_dir: /results

  # Long-running HTTP trigger for the dashboard's Scenario Lab "Run" button.
  #   docker compose -f compose.loadgen.yml up -d loadgen-serve
  # Publishes :8089 on box #2's PRIVATE IP only (SG: allow 8089 from box #1's SG, never the internet).
  loadgen-serve:
    image: bulkhead/loadgen:prod
    command: ["serve"]
    restart: unless-stopped
    environment:
      LISTEN: ":8089"
      LOADGEN_TARGET: ${LOADGEN_TARGET:?}
      LOADGEN_KEYS_FILE: /keys.json
      LOADGEN_ADMIN_KEY: ${ADMIN_API_KEY:?}
    volumes: ["./keys.json:/keys.json:ro"]
    ports: ["${LOADGEN_BIND_IP:?}:8089:8089"]
